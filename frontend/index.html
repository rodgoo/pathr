<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: no iPhone em tela cheia o app precisa pintar até a
         borda; as áreas do notch e da barra de gestos voltam como
         env(safe-area-inset-*) e são respeitadas no CSS, não aqui. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="theme-color" content="#000000" />
    <title>PathR — plano de estudos em tecnologia, do seu currículo ao emprego</title>
    <meta
      name="description"
      content="Estude programação com um roadmap gerado do seu currículo: fases e módulos por tecnologia, biblioteca curada, quizzes, inglês corporativo, cursos com certificado e vagas que combinam. Grátis."
    />
    <link rel="canonical" href="https://pathr.notter.com.br/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="PathR" />

    <!-- Open Graph / Twitter: o cartão que WhatsApp, LinkedIn, Telegram e X
         mostram ao compartilhar o link. Esses robôs NÃO rodam JavaScript, então
         o cartão precisa estar aqui no HTML estático — é o que faz cada link
         compartilhado virar um convite com título, texto e imagem. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PathR" />
    <meta property="og:title" content="PathR — plano de estudos em tecnologia, do seu currículo ao emprego" />
    <meta property="og:description" content="Um roadmap de estudos gerado do seu currículo: tecnologias por fase, biblioteca curada, quizzes, inglês corporativo, cursos com certificado e vagas que combinam. Grátis." />
    <meta property="og:url" content="https://pathr.notter.com.br/" />
    <meta property="og:image" content="https://pathr.notter.com.br/icons/icon-512.png" />
    <meta property="og:image:alt" content="PathR — plano de estudos em tecnologia" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PathR — plano de estudos em tecnologia" />
    <meta name="twitter:description" content="Roadmap de estudos gerado do seu currículo, com biblioteca curada, quizzes, inglês corporativo e vagas que combinam. Grátis." />
    <meta name="twitter:image" content="https://pathr.notter.com.br/icons/icon-512.png" />

    <!-- Dados estruturados (JSON-LD): descrevem o produto para o Google em
         linguagem de máquina. Não executam nada (type ld+json é dado, não
         script) — o buscador lê para montar o resultado rico e entender que
         isto é um app de educação gratuito. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "PathR",
            "url": "https://pathr.notter.com.br/",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web, Android, iOS",
            "inLanguage": ["pt-BR", "en", "es", "fr", "de"],
            "description": "Plano de estudos em tecnologia gerado do seu currículo: roadmap por fases e tecnologias, biblioteca curada, quizzes, inglês corporativo, cursos com certificado e vagas que combinam.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" }
          },
          {
            "@type": "Organization",
            "name": "PathR",
            "url": "https://pathr.notter.com.br/",
            "logo": "https://pathr.notter.com.br/icons/icon-512.png"
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "O que é o PathR?",
                "acceptedAnswer": { "@type": "Answer", "text": "Um plano de estudos gratuito para quem estuda tecnologia. Ele monta um roadmap a partir do seu currículo e objetivo, com módulos por tecnologia, biblioteca curada, quizzes, inglês corporativo, cursos com certificado e vagas que combinam com você." }
              },
              {
                "@type": "Question",
                "name": "O PathR é gratuito?",
                "acceptedAnswer": { "@type": "Answer", "text": "Sim. É uma ferramenta gratuita de plano de estudos, para maiores de 18 anos." }
              },
              {
                "@type": "Question",
                "name": "Serve para estudar quais linguagens e tecnologias?",
                "acceptedAnswer": { "@type": "Answer", "text": "Java, JavaScript, TypeScript, Python, Go, React, Node.js, SQL, Docker, entre outras — o roadmap se adapta ao seu objetivo e às tecnologias que você quer aprender." }
              }
            ]
          }
        ]
      }
    </script>

    <!-- Instalação na tela de início. O manifest serve a todos os navegadores;
         as três metas `apple-` abaixo existem porque o Safari do iPhone só
         passou a ler o manifest no 16.4, e ainda hoje é o `apple-touch-icon`
         que ele usa como ícone — o do manifest é ignorado. Sem elas o app
         abriria dentro do Safari, com barra de endereço, e com um retrato da
         página no lugar do ícone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PathR" />
    <!-- black-translucent: o conteúdo passa por baixo da barra de status e o
         app pinta o próprio fundo ali. As alternativas deixariam uma faixa
         preta ou branca com emenda visível contra o #000000 do produto. O
         espaço da Dynamic Island volta como safe-area-inset-top, e o AppShell
         o reserva — sem isso o relógio ficaria sobre o cabeçalho. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Tela de abertura do app instalado. Sem estas imagens o iOS mostra um
         retângulo branco entre o toque no ícone e a primeira pintura — num
         app de fundo escuro, o flash é agressivo. O Safari exige tamanho
         EXATO por aparelho, daí uma media query por resolução; um arquivo
         genérico é simplesmente ignorado.
         402x874 @3x é o iPhone 17 Pro. -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/splash-1206x2622.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/splash-1320x2868.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/splash-1179x2556.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/splash-1290x2796.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
