<!doctype html>
<!--
  A página de endereço inexistente.

  Existe para que o servidor possa dizer 404 de verdade. Antes, toda URL
  desconhecida devolvia a casca do app com status 200 — e "200 com conteúdo
  genérico" é o que o Google chama de soft 404: ele conclui que o site
  responde qualquer coisa para qualquer endereço.

  Estática e sem JavaScript de propósito: se o que falhou foi o app, carregar
  o app de novo para explicar o erro é a pior escolha possível.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada · PathR</title>
    <meta name="robots" content="noindex" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0c0c10;
        color: #e9e9ed;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 21px; font-weight: 500; margin: 0 0 8px; }
      p { color: rgba(233, 233, 237, 0.6); margin: 0 0 20px; max-width: 46ch; }
      a {
        color: #0c0c10;
        background: #9184d9;
        padding: 10px 18px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Esta página não existe</h1>
      <p>O endereço pode ter mudado, ou o link que trouxe você até aqui está errado.</p>
      <a href="/">Ir para o início</a>
    </main>
  </body>
</html>
