# Os testes rodando em cada push e em cada PR.
#
# Existe para que contribuição de fora não dependa de alguém rodar a suíte na
# própria máquina — e para que a quebra apareça no PR, não depois do merge.
#
# Nenhum segredo é usado: a suíte não fala com Supabase, com IA nem com a rede
# (ver tests/conftest.py, que desliga as saídas). As variáveis abaixo são
# sintéticas, só para o `Settings` conseguir instanciar.

name: testes

on:
  push:
    branches: [main]
  pull_request:

# Dois pushes seguidos no mesmo PR cancelam a execução anterior: o que
# interessa é o estado atual do ramo, não a fila.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      SUPABASE_URL: https://exemplo.supabase.co
      SUPABASE_SECRET_KEY: chave-de-teste
      JWT_SECRET_KEY: chave-de-teste-com-mais-de-trinta-e-dois-bytes
      MFA_ENCRYPTION_KEY: x4kQ4W8nR2vY7tZ1pL3mJ6bN9cV0sA5dF8gH2jK4lM0=
      DATA_ENCRYPTION_KEY: x4kQ4W8nR2vY7tZ1pL3mJ6bN9cV0sA5dF8gH2jK4lM0=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `--force`: o build incremental acredita no que já compilou e engole
      # justamente o erro mais perigoso, o do símbolo que deixou de existir.
      - run: npx tsc -b --force
      - run: npx vitest run
      - run: npx vite build
        env:
          VITE_API_URL: https://api.exemplo.dev
